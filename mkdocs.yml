site_name: ChronoScope
site_description: Verbraucherorientierte Dokumentation und Tutorials für ChronoScope.
site_url: https://docs.ni0.team/

site_author: NI0 - Name Ideas 0
copyright: Copyright &copy; 2026 NI0 - Name Ideas 0

theme:
  name: material
  language: de
  logo: assets/images/ChronoScope_logo.svg
  favicon: assets/images/ChronoScope_logo.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
  font:
    text: Source Sans 3
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.share
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - toc.integrate
    - toc.follow

extra_css:
  - assets/stylesheets/brand.css

nav:
  - Start: index.md
  - Loslegen:
      - getting-started.md
      - tutorials/first-plan.md
  - Funktionen:
      - concepts/tasks.md
      - concepts/calendar.md
      - concepts/settings.md
  - Installation:
      - concepts/tasks.md
      - concepts/calendar.md
  - Hilfe:
      - faq.md
      - writing-guide.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: de
