site_name: ChronoScope Docs
site_description: Verbraucherorientierte Dokumentation und Tutorials fuer ChronoScope.
site_url: https://docs.ni0.team/

site_author: NI0 - Name Ideas 0
copyright: Copyright &copy; 2026 NI0 - Name Ideas 0

repo_url: https://github.com/NI0-Name-Ideas-0/ni0.team-docs/
repo_name: NI0-Name-Ideas-0/ni0.team-docs

theme:
  name: material
  language: de
  logo: assets/images/logo-placeholder.svg
  favicon: assets/images/favicon-placeholder.svg
  palette:
    - scheme: default
      primary: teal
      accent: amber
  font:
    text: Source Sans 3
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.share
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.action.edit
    - toc.follow

nav:
  - Start: index.md
  - Loslegen:
      - getting-started.md
      - tutorials/first-plan.md
  - Funktionen:
      - concepts/tasks.md
      - concepts/calendar.md
  - Hilfe:
      - faq.md
      - writing-guide.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: de

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NI0-Name-Ideas-0
